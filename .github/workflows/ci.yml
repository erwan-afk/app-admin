name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, json
      - name: Composer install
        run: composer install --no-interaction --prefer-dist
      - name: PHP lint
        run: |
          for f in $(find admin src -name '*.php'); do php -l "$f"; done
      - name: phpstan
        run: vendor/bin/phpstan analyse --no-progress

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin/front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npx tsc -b --noEmit
      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push — vérifie juste que le Dockerfile build)
        run: docker build -t app-admin:ci .
